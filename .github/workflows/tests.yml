name: Tests

# Fast, hermetic test run. No network access is needed at test time: the suite
# builds synthetic Photon-HDF5 files (tests/synthdata.py + tests/conftest.py)
# instead of downloading the real example datasets. Running the notebooks
# against the real data is a separate, opt-in workflow (notebooks.yml) so that
# a dead download URL cannot turn every pull request red.

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never let one red cell cancel the rest: a single unsupported
      # interpreter used to hide the result of every other combination.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # setuptools_scm derives the version from tags, so the full history
          # (and its tags) must be present.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is stale w.r.t. pyproject.toml, so a
      # dependency edit that forgot to re-lock is caught here rather than
      # being silently resolved differently in CI than on a developer machine.
      # The `scientific` extra brings matplotlib, which the plotting tests
      # import; `gui` (PyQt5) is deliberately left out.
      - name: Sync environment
        run: uv sync --locked --extra scientific --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-sync pytest -v
        env:
          MPLBACKEND: Agg
