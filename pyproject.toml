[build-system]
requires = [
    "setuptools>=64", 
    "setuptools_scm>=6.0",
    "cython>=3.0",
    "pybind11>=2.12", 
    "numpy>=1.19",
]
build-backend = "setuptools.build_meta"

[project]
name = "fretbursts"
dynamic = ["version", ]
authors = [
    {name="Antonio Ingargiola", email="tritemio@gmail.com"}, 
    {name="Paul David Harris", email="harripd@gmail.com"}]
description = "Burst analysis toolkit for single and multi-spot smFRET data."
readme = "README.md"
license = {file = "LICENSE.txt"}
keywords = ["single-molecule FRET","smFRET", "burst-analysis", "biophysics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering"
 ]
requires-python = ">= 3.10"
dependencies = [
    "numpy>=1.19",
    "scipy>=1.6",  # scipy.integrate.trapezoid (numpy-2 replacement for trapz)
    "pandas >= 0.23",
    "seaborn>=0.11.1",
    "tables>=3.5",
    "lmfit>=1.0.1",
    "phconvert>=0.8"
    ]
 
[project.urls]
Homepage = "http://opensmfs.github.io/FRETBursts/"
Documentation = "https://fretbursts.readthedocs.io/en/latest/"
Issues = "https://github.com/OpenSMFS/FRETBursts/"
Repository = "https://github.com/OpenSMFS/FRETBursts/issues"

[project.optional-dependencies]
scientific = ["jupyter", "matplotlib>=3.0.1"]
gui = ["matplotlib>=3.0.1", "PyQt5"]

[dependency-groups]
# Development-only deps (PEP 735). Installed by `uv sync`, excluded from the
# published package. Install with: uv sync
dev = [
    "pytest>=8",
    "ruff>=0.11",
    # numba backs the phrates numba kernels. numba>=0.66 ships Python 3.14
    # wheels, so no version gate is needed.
    "numba>=0.66",
    # Notebook-based test harness (notebooks/nbrun.py)
    "nbconvert>=7",
    "nbformat>=5",
    "ipykernel>=6",
]

[tool.setuptools.packages.find]
include = ['fretbursts*']

[tool.setuptools.package-data]
fretbursts = ["phtools/*.pyx", ]

[tool.setuptools_scm]
version_scheme = "post-release"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Broad but pragmatic set: pyflakes/pycodestyle errors + warnings, isort,
# pyupgrade, bugbear, flake8-comprehensions. Formatting-owned rules (E501)
# are deferred to the future `ruff format` step.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line-too-long — will be handled when `ruff format` is adopted
]

[tool.ruff.lint.per-file-ignores]
# Legacy modules with undefined-name (F821) noise from their demo/__main__
# blocks. These modules are still imported by live code, so they are kept;
# silence the demo-block findings rather than rewrite the blocks.
"fretbursts/poisson_threshold.py" = ["F821"]
"fretbursts/fit/gaussian_fitting.py" = ["F821"]
"fretbursts/dataload/multi_ch_reader.py" = ["F821"]
